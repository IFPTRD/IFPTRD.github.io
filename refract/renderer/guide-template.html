<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Guide</title>
<meta name="refract-format-version" content="1">
<style>
:root{--navy:#193a4d;--navy2:#23586b;--teal:#176f76;--text:#1d3340;--muted:#607380;--border:#dae3e8;--bg:#f5f7f9;--tint:#e8f3f3;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.57 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}a{color:var(--teal)}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #db9d37;outline-offset:3px}button,input{font:inherit}
.site-header{background:var(--navy);color:white;padding:13px 24px}.site-header-inner{max-width:1420px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.site-brand{font-size:20px;font-weight:750;line-height:1.25;letter-spacing:-.35px}.site-subtitle{font-size:12px;color:#d3e5eb;margin-top:2px}.header-tools{display:flex;align-items:center;gap:8px}.header-tools input{width:260px;max-width:36vw;padding:9px 12px;border:1px solid #b7cbd0;border-radius:7px;background:white;color:var(--text)}.header-tools button{border:1px solid #8ca4b1;background:transparent;border-radius:7px;padding:9px 11px;color:white;cursor:pointer}.header-tools button:hover{background:#315c6f}.header-tools #print{display:grid;place-items:center;width:38px;height:38px;padding:0;flex:none}.header-tools #print svg{display:block}
.shell{max-width:1460px;margin:0 auto;padding:22px 26px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px}.sidebar{align-self:start;position:sticky;top:18px;padding-top:6px}.nav-heading{font-size:10px;text-transform:uppercase;color:#647b88;letter-spacing:1px;font-weight:800;margin:0 0 9px 12px}.site-nav{display:grid;gap:3px}.site-nav a{display:block;text-decoration:none;color:#354f60;padding:9px 12px;border:1px solid transparent;border-radius:7px;line-height:1.34}.site-nav a[aria-current="page"]{color:#104d55;background:var(--tint);border-color:#a9d0d0;font-weight:750}.site-nav a:hover:not([aria-current]){background:#e9eef1}.site-nav a.child{padding-left:28px;font-size:13px;color:#536b77}.site-nav a.child[aria-current]{color:#104d55}.main{min-width:0;max-width:1120px}.page{display:none}.page.active{display:block}.page h1{font-size:31px;line-height:1.22;letter-spacing:-.6px;margin:3px 0 11px}.page-intro{font-size:16px;color:var(--muted);max-width:920px;margin:0 0 22px}.page h2{font-size:19px;letter-spacing:-.25px;line-height:1.3;margin:28px 0 10px}.page h3{font-size:16px;margin:0 0 5px;line-height:1.36}.page p{max-width:950px}.section-block{margin:18px 0 24px}.section-block>h2:first-child{margin-top:0}.hero{background:linear-gradient(115deg,var(--navy),var(--navy2));border-radius:11px;color:white;padding:25px 28px}.hero .kicker{display:block;color:#a5deda;font-size:11px;letter-spacing:1px;font-weight:800;text-transform:uppercase}.hero h2{font-size:24px;margin:7px 0 8px;max-width:800px;color:white}.hero p{color:#e2eef1;margin:0}.note{background:#ecf6f5;border-left:4px solid var(--teal);border-radius:7px;padding:14px 19px}.note strong{display:block;margin:0 0 3px}.note p{margin:0}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.content-card{background:white;border:1px solid var(--border);border-radius:9px;padding:17px 19px;min-width:0}.content-card p{margin:4px 0 0;color:#4b6473}.content-card:has(a):hover{border-color:#83b7bb;box-shadow:0 3px 12px #102f4210}.content-card a{text-decoration:none;font-weight:750}.content-card a:hover{text-decoration:underline}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}.check{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;border-bottom:1px solid var(--border);padding:12px 0}.check-number{font-size:23px;color:var(--teal);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}.check p{margin:4px 0 0;color:#586b77}.steps{list-style:none;counter-reset:st;padding:0;display:grid;gap:9px}.steps li{counter-increment:st;position:relative;border:1px solid var(--border);border-radius:8px;background:white;padding:14px 17px 14px 56px}.steps li:before{content:counter(st);position:absolute;left:16px;top:14px;background:var(--tint);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;color:var(--teal);font-weight:800}.steps p{margin:4px 0 0;color:#516877}.bullets{padding-left:22px;max-width:920px}.bullets li{margin-bottom:8px}.table-wrap{overflow-x:auto;background:white;border:1px solid var(--border);border-radius:9px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:11px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);overflow-wrap:break-word}th{background:var(--tint);font-size:12px;white-space:normal}tbody tr:last-child td{border-bottom:0}.resources{background:#fff;border:1px solid var(--border);padding:15px 19px;border-radius:8px}.resources ul{margin:6px 0;padding-left:21px}.resources li{padding:5px 0}.resources a{text-decoration:none;font-weight:650}.resources a:hover{text-decoration:underline}.resources small{display:block;color:var(--muted)}.glossary{border:1px solid var(--border);border-radius:8px;background:#fff;margin:0}.glossary div{display:grid;grid-template-columns:160px 1fr;padding:10px 16px;gap:15px}.glossary div+div{border-top:1px solid var(--border)}.glossary dt{font-weight:800;color:var(--teal)}.glossary dd{margin:0}abbr[title]{text-decoration:underline dotted #8ba4a9;text-underline-offset:3px;cursor:help}.page-footer{border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:20px;padding:20px 0 35px;margin-top:42px}.footlink{display:block;min-width:0;max-width:48%;text-decoration:none;color:var(--text);padding:7px 2px}.footlink:last-child{text-align:right;margin-left:auto}.footlink:hover .footname{color:var(--teal)}.foot-label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.7px;font-weight:750}.footname{font-weight:750}.search-panel{position:fixed;z-index:10;top:63px;right:max(25px,calc((100vw - 1400px)/2));width:min(390px,calc(100vw - 25px));background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 14px 28px #1734432a;padding:8px;display:none}.search-panel.visible{display:block}.search-panel a{display:block;text-decoration:none;padding:10px 13px;color:var(--text);border-radius:6px}.search-panel a:hover{background:var(--tint)}.search-panel p{padding:6px 12px;color:var(--muted)}
@media(max-width:980px){.shell{grid-template-columns:1fr;gap:18px;padding:20px}.sidebar{position:static}.site-nav{grid-template-columns:repeat(3,1fr)}.nav-heading{display:none}.site-nav a.child{padding-left:13px}.site-nav a{font-size:13px}}@media(max-width:650px){.site-header{padding:12px 15px}.site-header-inner{flex-wrap:wrap}.header-tools{width:100%}.header-tools input{max-width:none;width:100%;flex:1;min-width:0}.shell{padding:16px}.site-nav{grid-template-columns:repeat(2,1fr)}.card-grid,.checks{grid-template-columns:1fr}.page h1{font-size:27px}.hero{padding:22px}.glossary div{grid-template-columns:1fr;gap:2px}table{font-size:13px}th,td{padding:9px}.search-panel{right:10px;top:105px}}
@page{size:auto;margin:15mm}@media print{body{background:white;color:#000;font-size:10pt}.site-header,.sidebar,.search-panel,.page-footer{display:none!important}.shell{display:block;padding:0;margin:0}.main{max-width:none}.page,.page.active{display:block!important;margin:0 0 15pt}.page:not(:first-child){break-before:auto}.page h1{font-size:19pt;break-after:avoid;margin:16pt 0 7pt}.page h2{font-size:13pt;break-after:avoid;margin:15pt 0 6pt}.page-intro{font-size:10pt}.hero{background:white!important;color:#000!important;border:1px solid #aaa;padding:12pt}.hero *{color:#000!important}.card-grid,.checks{gap:0 10pt}.content-card,.note,.steps li,.resources,.glossary{break-inside:avoid;background:white!important}.table-wrap{overflow:visible;border:0}table{font-size:9pt}th,td{padding:6pt;border:1px solid #bbb}thead{display:table-header-group}tr{break-inside:avoid}a{color:#000;text-decoration:none}a[href^="http"]:after{content:" (" attr(href) ")";font-size:8pt;color:#666;overflow-wrap:anywhere}}
.rf-edit-zone{position:relative;border-radius:7px;outline:2px solid transparent;outline-offset:4px;cursor:pointer}.rf-edit-zone:hover{outline-color:#91c6c5}.rf-edit-zone.rf-selected{outline-color:#176f76;background:rgba(23,111,118,.025)}.rf-edit-zone:focus-visible{outline:3px solid #176f76}.rf-edit-zone::before{content:'Select to edit';position:absolute;top:0;right:4px;font:600 10px system-ui,sans-serif;color:#176f76;background:#e8f3f3;border-radius:4px;padding:2px 5px;opacity:0;pointer-events:none}.rf-edit-zone:hover::before{opacity:1}@media print{.rf-edit-zone{outline:0!important;background:transparent!important}.rf-edit-zone::before{display:none!important}}
</style>
</head><body>
<script type="application/json" id="guide-data">__DATA_JSON__</script>
<header class="site-header"><div class="site-header-inner"><div><div class="site-brand" id="brand"></div><div class="site-subtitle" id="subtitle"></div></div><div class="header-tools"><label for="search" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden">Search guide</label><input id="search" type="search" placeholder="Search topics, terms, resources" aria-label="Search the guide"><button id="print" type="button" title="Print guide" aria-label="Print guide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6zM18 12h.01"/></svg></button></div></div></header>
<div class="search-panel" id="search-panel" aria-live="polite"></div>
<div class="shell"><aside class="sidebar"><div class="nav-heading">Contents</div><nav class="site-nav" aria-label="Guide pages" id="nav"></nav></aside><main class="main" id="main"></main></div>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('guide-data').textContent);
const pages=data.pages || [];const gloss=Array.isArray(data.glossary)?data.glossary:[];
const editPreview=__EDITOR_MODE__, initialPageId=__EDITOR_PAGE__;
function notifyStudio(type,details){if(editPreview&&window.parent!==window)window.parent.postMessage(Object.assign({source:'refract-preview',type},details),'*')}

const $=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>String(s||'').split(/(\[\[[^\]]+\]\])/g).map(part=>{const m=part.match(/^\[\[(.*?)\]\]$/);if(!m)return esc(part);const term=m[1].trim();const g=gloss.find(x=>String(x.term||'').toLowerCase()===term.toLowerCase());return g?'<abbr title="'+esc(g.definition)+'">'+esc(term)+'</abbr>':esc(term)}).join('');
const id=p=>String(p.id||'').replace(/[^a-z0-9-]/gi,'');const internalLink=(page,text)=>pages.some(p=>id(p)===page)?'<a href="#'+esc(page)+'">'+fmt(text)+'</a>':fmt(text);
const validHref=url=>/^https?:\/\//i.test(String(url||''))?String(url):'';
function renderBlock(b){if(!b||typeof b!=='object')return'';const title=b.title?'<h2>'+fmt(b.title)+'</h2>':'';const list=Array.isArray(b.items)?b.items:[];
switch(b.type){
case 'hero':return '<div class="section-block hero">'+(b.kicker?'<span class="kicker">'+fmt(b.kicker)+'</span>':'')+'<h2>'+fmt(b.title)+'</h2><p>'+fmt(b.text)+'</p></div>';
case 'paragraph':return '<section class="section-block">'+title+'<p>'+fmt(b.text)+'</p></section>';
case 'note':return '<aside class="section-block note"><strong>'+fmt(b.label||'Note')+'</strong><p>'+fmt(b.text)+'</p></aside>';
case 'cards':return '<section class="section-block">'+title+'<div class="card-grid">'+list.map(x=>'<article class="content-card"><h3>'+(x.link?internalLink(x.link,x.title):fmt(x.title))+'</h3><p>'+fmt(x.text)+'</p></article>').join('')+'</div></section>';
case 'checks':return '<section class="section-block">'+title+'<div class="checks">'+list.map((x,i)=>'<div class="check"><div class="check-number">'+String(i+1).padStart(2,'0')+'</div><div><h3>'+fmt(x.title)+'</h3><p>'+fmt(x.detail)+'</p></div></div>').join('')+'</div></section>';
case 'steps':return '<section class="section-block">'+title+'<ol class="steps">'+list.map(x=>'<li><h3>'+fmt(x.title)+'</h3><p>'+fmt(x.text)+'</p></li>').join('')+'</ol></section>';
case 'bullets':return '<section class="section-block">'+title+'<ul class="bullets">'+list.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</ul></section>';
case 'table':{const cols=Array.isArray(b.columns)?b.columns:[];const rows=Array.isArray(b.rows)?b.rows:[];return '<section class="section-block">'+title+'<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th scope="col">'+fmt(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map((_,i)=>'<td>'+fmt((r||[])[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>'}
case 'resources':return '<section class="section-block resources">'+title+'<ul>'+list.map(x=>{const u=validHref(x.url);return '<li>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+fmt(x.title)+'</a>':fmt(x.title))+(x.note?'<small>'+fmt(x.note)+'</small>':'')+'</li>'}).join('')+'</ul></section>';
case 'glossary':return '<section class="section-block">'+title+'<dl class="glossary">'+list.map(x=>'<div><dt>'+fmt(x.term)+'</dt><dd>'+fmt(x.definition)+'</dd></div>').join('')+'</dl></section>';
default:return ''}}
function mainHtml(p,i){return '<section class="page" id="page-'+esc(id(p))+'"><h1>'+fmt(p.title)+'</h1>'+(p.intro?'<p class="page-intro">'+fmt(p.intro)+'</p>':'')+(Array.isArray(p.blocks)?p.blocks:[]).map((block,bi)=>editPreview?'<div class="rf-edit-zone" tabindex="0" data-rf-block="'+bi+'">'+renderBlock(block)+'</div>':renderBlock(block)).join('')+'<div class="page-footer">'+(i?'<a class="footlink" href="#'+esc(id(pages[i-1]))+'"><span class="foot-label">Previous</span><span class="footname">← '+fmt(pages[i-1].title)+'</span></a>':'<span></span>')+(i<pages.length-1?'<a class="footlink" href="#'+esc(id(pages[i+1]))+'"><span class="foot-label">Next</span><span class="footname">'+fmt(pages[i+1].title)+' →</span></a>':'')+'</div></section>'}
$('brand').textContent=(data.meta||{}).title||'Reference guide';$('subtitle').textContent=(data.meta||{}).subtitle||'';document.title=((data.meta||{}).title||'Reference guide');
$('main').innerHTML=pages.map(mainHtml).join('');$('nav').innerHTML=pages.map(p=>'<a class="'+(p.parent?'child':'')+'" href="#'+esc(id(p))+'">'+fmt(p.title)+'</a>').join('');
let previewPage=editPreview?initialPageId:null;function select(){const hash=previewPage||decodeURIComponent(location.hash.slice(1));const current=pages.some(p=>id(p)===hash)?hash:id(pages[0]||{});document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+current));document.querySelectorAll('.site-nav a').forEach(a=>{if(a.getAttribute('href')==='#'+current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('search-panel').classList.remove('visible');window.scrollTo(0,0);notifyStudio('page',{pageId:current})}
document.addEventListener('click',e=>{if(editPreview){const block=e.target.closest('[data-rf-block]');if(block){const active=block.closest('.page');if(active){const pageId=active.id.slice(5),blockIndex=Number(block.getAttribute('data-rf-block'));notifyStudio('block',{pageId,blockIndex});document.querySelectorAll('.rf-selected').forEach(el=>el.classList.remove('rf-selected'));block.classList.add('rf-selected')}}}const a=e.target.closest('a[href^="#"]');if(a&&location.protocol==='about:'){e.preventDefault();previewPage=decodeURIComponent(a.getAttribute('href').slice(1));select()}});window.addEventListener('hashchange',select);if(editPreview){window.addEventListener('message',e=>{const m=e.data;if(!m||m.source!=='refract-studio'||m.type!=='select')return;if(m.pageId&&pages.some(p=>id(p)===m.pageId)&&m.pageId!==previewPage){previewPage=m.pageId;select()}document.querySelectorAll('.rf-selected').forEach(el=>el.classList.remove('rf-selected'));if(Number.isInteger(m.blockIndex)){const b=document.querySelector('#page-'+CSS.escape(m.pageId||previewPage)+' [data-rf-block="'+m.blockIndex+'"]');if(b){b.classList.add('rf-selected');b.scrollIntoView({block:'nearest',behavior:'smooth'})}}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-rf-block]')){e.preventDefault();e.target.click()}})}select();$('print').addEventListener('click',()=>window.print());
$('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q){$('search-panel').classList.remove('visible');return}const hits=pages.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).slice(0,10);$('search-panel').innerHTML=hits.length?hits.map(p=>'<a href="#'+esc(id(p))+'">'+fmt(p.title)+'</a>').join(''):'<p>No matching pages</p>';$('search-panel').classList.add('visible')});
$('search-panel').addEventListener('click',e=>{if(e.target.closest('a')){$('search').value='';$('search-panel').classList.remove('visible')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('search-panel').classList.remove('visible');$('search').blur()}});
})();
</script>
</body></html>
