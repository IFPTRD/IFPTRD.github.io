/* Refract Executive Design System v2 — semantic UI components, responsive and print-first */
:root{--navy:#1b3d50;--navy2:#28576b;--teal:#14777c;--text:#1b3647;--muted:#5a7280;--border:#d7e2e7;--bg:#fff;--tint:#edf6f5;--white:#fff}
body{background:white;color:var(--text);font-size:14.5px;line-height:1.52;letter-spacing:.002em}
.site-header{position:relative;background:#fff;color:var(--text);border-bottom:1px solid #dbe5e9;padding:11px 26px;box-shadow:none}

.header-tools button{color:#20465b;border-color:#c6d7df;background:#fff;border-radius:8px}.header-tools button:hover{background:#eff5f7}
.header-tools #print{background:var(--navy);color:white;border-color:var(--navy);width:36px;height:36px}
.header-tools #print:hover{background:#2b6171}
.shell{max-width:1600px;min-height:calc(100vh - 68px);padding:0;grid-template-columns:256px minmax(0,1fr);gap:0}
.sidebar{background:#f5f7f8;border-right:1px solid #dce5e9;padding:31px 18px 36px 25px;position:sticky;top:0;max-height:100dvh;overflow-y:auto;scrollbar-gutter:stable;align-self:start}
.nav-heading{font-weight:700;margin:0 0 13px 12px;color:#728792;letter-spacing:1px}
.site-nav{gap:2px}.site-nav a{border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.26;font-weight:620;color:#365265}
.site-nav a.child{font-size:12.5px;color:#637d89;margin-left:15px;padding:7px 8px 8px 15px;border-left:2px solid #dce6e9;border-radius:0 6px 6px 0}
.site-nav a[aria-current="page"]{background:#e6f3f2;border-color:#b4d8d7;color:#0c6168;font-weight:750}
.site-nav a.child[aria-current]{border-left:3px solid #18848a;background:transparent;color:#0a6670}
.main{padding:30px 40px 55px;max-width:1320px;width:100%;margin:0 auto}
.page h1{font-size:27px;line-height:1.24;letter-spacing:-.55px;margin:1px 0 9px;color:#193e52}
.page-intro{font-size:15.5px;line-height:1.55;color:#567182;max-width:930px;margin:0 0 20px}
.page h2{font-size:18px;line-height:1.26;font-weight:740;color:#1d4458;margin:23px 0 10px}
.page h3{font-size:14px;font-weight:720;color:#203e50}
.section-block{margin:15px 0 23px}.section-block>h2:first-child{margin-top:0}
.hero{background:linear-gradient(112deg,#173a4d,#235666);border-radius:9px;padding:22px 26px;margin:13px 0 25px}
.hero .kicker{color:#b7e0db;font-size:10px;letter-spacing:.9px}.hero h2{font-size:22px;letter-spacing:-.25px;font-weight:730;margin:6px 0}.hero p{font-size:14.5px}
.note{background:#f0f7f6;border:1px solid #dce9e6;border-left:3px solid #238287;border-radius:5px;padding:12px 16px}
.note strong{font-size:13px;color:#284c54}.note p{font-size:13.5px;line-height:1.5}
.card-grid{gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.content-card{border-radius:8px;box-shadow:none;padding:15px 17px}.content-card p{font-size:13.5px;line-height:1.45;margin-top:3px}
.content-card h3{line-height:1.35}.content-card a{color:#126b72}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--check-rows),auto);grid-auto-flow:column;gap:0 26px}
.check{grid-template-columns:40px minmax(0,1fr);gap:8px;padding:11px 0;border-bottom:1px solid #d8e4e8}
.check-number{font-size:18px;color:#0b7b80;line-height:1.2;font-weight:760}
.check h3{font-size:13.5px}.check p{font-size:13px;line-height:1.45;margin-top:4px}
.steps{gap:7px}.steps li{background:white;border-radius:6px;padding:12px 14px 12px 50px}.steps li::before{left:13px;top:12px;font-size:13px;width:25px;height:25px}
.steps p{font-size:13.5px;line-height:1.48}
.table-wrap{border-radius:7px}.table-wrap th{background:#eaf3f2;color:#27485a;font-size:12px}
.table-wrap td{font-size:13.5px;line-height:1.46}.table-wrap td:first-child{color:#23465b;font-weight:650}
.table-wrap th,.table-wrap td{padding:10px 12px}.resources{padding:14px 17px}.resources a{color:#166c75}
.glossary dt{font-size:13.5px}.glossary dd{font-size:13px}
.page-footer{margin-top:30px;padding:14px 0 30px;gap:25px}.foot-label{font-size:10px;color:#788a93}.footname{font-size:13px}
.search-panel{top:57px;border-radius:8px}.search-panel a .search-type{display:block;font-size:10px;text-transform:uppercase;color:#6c8490;letter-spacing:.5px;margin-bottom:2px}
/* Content-specific blocks: restrained executive visuals built from real source data */
.gov-model{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch;margin:12px 0}
.gov-lane{border:1px solid #d5e0e5;border-radius:9px;background:#f8fafb;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.gov-lane:nth-child(1){border-top:4px solid #315477}.gov-lane:nth-child(2){border-top:4px solid #8c9fa7}.gov-lane:nth-child(3){border-top:4px solid #584569}
.gov-lane-title{font-size:12px;text-transform:uppercase;letter-spacing:.45px;text-align:center;padding:13px 9px 9px;font-weight:780;color:#193e52}
.gov-lane-desc{margin:0 15px 12px!important;font-size:12.2px;color:#5e7480;text-align:center;line-height:1.45}
.gov-lane-list{display:grid;align-content:start;gap:8px;padding:0 11px 14px;flex:1}

.gov-node strong{display:block;font-size:12.5px;font-weight:730;line-height:1.4}.gov-node p{font-size:12px;line-height:1.42;color:#55707e;margin:4px 0 0}
.gov-caption{font-size:12px;color:#6c8290;margin:7px 0 0;line-height:1.4}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:11px 0 15px}
.timeline-item{border:1px solid #d5e0e5;border-radius:8px;padding:15px 16px;background:#fff;min-width:0;border-top:3px solid #8dbebc}
.timeline-period{color:#10757b;font-weight:780;font-size:11px;letter-spacing:.35px;text-transform:uppercase}.timeline-item h3{font-size:14.5px;margin:5px 0}.timeline-item p{color:#526e7c;font-size:12.8px;line-height:1.48;margin:0}
@media(max-width:1000px){.shell{grid-template-columns:216px minmax(0,1fr)}.sidebar{padding:26px 10px 26px 16px}.main{padding:25px 25px 40px}.card-grid{gap:9px}}
@media(max-width:820px){.shell{display:block;min-height:0}.sidebar{position:static;max-height:none;padding:10px 14px;border-right:0;border-bottom:1px solid #dae4e7}.site-nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.site-nav a,.site-nav a.child{font-size:12px;padding:7px 9px;margin:0;border:0;border-radius:6px}.main{padding:22px 20px 38px;max-width:1050px}.nav-heading{display:none}}
@media(max-width:620px){.site-header{padding:10px 14px}.site-brand{font-size:16px}.header-tools{width:100%}.header-tools input{max-width:none;flex:1;min-width:0}.shell{padding:0}.main{padding:19px 15px 32px}.site-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.page h1{font-size:24px}.page-intro{font-size:14px}.hero{padding:18px}.hero h2{font-size:19px}.card-grid,.checks,.gov-model,.timeline{grid-template-columns:1fr}.checks{grid-template-rows:none;grid-auto-flow:row}.gov-lane-list{grid-template-columns:1fr}}
@media print{body{font:10pt/1.4 system-ui,sans-serif;color:black!important}.site-header,.sidebar,.search-panel,.page-footer{display:none!important}.shell{display:block;padding:0!important;margin:0}.main{padding:0!important;max-width:none}.page{display:block!important;break-before:auto;margin:0 0 14pt}.page h1{font-size:18pt;margin:12pt 0 5pt;break-after:avoid}.page h2{font-size:12.5pt;break-after:avoid;margin:13pt 0 5pt}.page-intro{font-size:10pt}.hero{color:black!important;background:white!important;border:1px solid #bbb}.hero *{color:black!important}.check,.gov-node,.timeline-item,.content-card,.steps li,.note{break-inside:avoid}.gov-model,.timeline{gap:5pt}.gov-lane{break-inside:avoid;background:white}.gov-lane-title{padding:6pt}.gov-node{padding:6pt}.table-wrap{border:0}thead{display:table-header-group}tr{break-inside:avoid}.section-block{break-inside:auto}.section-block>h2{break-after:avoid}.search-panel{display:none!important}a[href^="http"]::after{content:none}}

<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('guide-data').textContent);
const pages=data.pages || [];const gloss=Array.isArray(data.glossary)?data.glossary:[];
const editPreview=__EDITOR_MODE__, initialPageId=__EDITOR_PAGE__;
function notifyStudio(type,details){if(editPreview&&window.parent!==window)window.parent.postMessage(Object.assign({source:'refract-preview',type},details),'*')}

const $=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>String(s||'').split(/(\[\[[^\]]+\]\])/g).map(part=>{const m=part.match(/^\[\[(.*?)\]\]$/);if(!m)return esc(part);const term=m[1].trim();const g=gloss.find(x=>String(x.term||'').toLowerCase()===term.toLowerCase());return g?'<abbr title="'+esc(g.definition)+'">'+esc(term)+'</abbr>':esc(term)}).join('');
const id=p=>String(p.id||'').replace(/[^a-z0-9-]/gi,'');const internalLink=(page,text)=>pages.some(p=>id(p)===page)?'<a href="#'+esc(page)+'">'+fmt(text)+'</a>':fmt(text);
const validHref=url=>/^https?:\/\//i.test(String(url||''))?String(url):'';
function renderBlock(b){if(!b||typeof b!=='object')return'';const title=b.title?'<h2>'+fmt(b.title)+'</h2>':'';const list=Array.isArray(b.items)?b.items:[];
switch(b.type){
case 'hero':return '<div class="section-block hero">'+(b.kicker?'<span class="kicker">'+fmt(b.kicker)+'</span>':'')+'<h2>'+fmt(b.title)+'</h2><p>'+fmt(b.text)+'</p></div>';
case 'paragraph':return '<section class="section-block">'+title+'<p>'+fmt(b.text)+'</p></section>';
case 'note':return '<aside class="section-block note"><strong>'+fmt(b.label||'Note')+'</strong><p>'+fmt(b.text)+'</p></aside>';
case 'cards':return '<section class="section-block">'+title+'<div class="card-grid">'+list.map(x=>'<article class="content-card"><h3>'+(x.link?internalLink(x.link,x.title):fmt(x.title))+'</h3><p>'+fmt(x.text)+'</p></article>').join('')+'</div></section>';
case 'checks':return '<section class="section-block">'+title+'<div class="checks" style="--check-rows:'+Math.ceil(list.length/2)+'">'+list.map((x,i)=>'<div class="check"><div class="check-number">'+String(i+1).padStart(2,'0')+'</div><div><h3>'+fmt(x.title)+'</h3><p>'+fmt(x.detail)+'</p></div></div>').join('')+'</div></section>';
case 'steps':return '<section class="section-block">'+title+'<ol class="steps">'+list.map(x=>'<li><h3>'+fmt(x.title)+'</h3><p>'+fmt(x.text)+'</p></li>').join('')+'</ol></section>';
case 'bullets':return '<section class="section-block">'+title+'<ul class="bullets">'+list.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</ul></section>';
case 'table':{const cols=Array.isArray(b.columns)?b.columns:[];const rows=Array.isArray(b.rows)?b.rows:[];return '<section class="section-block">'+title+'<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th scope="col">'+fmt(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map((_,i)=>'<td>'+fmt((r||[])[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>'}
case 'governance':{const lanes=Array.isArray(b.columns)?b.columns:[];return '<section class="section-block">'+title+(b.intro?'<p class="page-intro">'+fmt(b.intro)+'</p>':'')+'<div class="gov-model">'+lanes.map(l=>'<article class="gov-lane"><div class="gov-lane-title">'+fmt(l.title)+'</div>'+(l.text?'<p class="gov-lane-desc">'+fmt(l.text)+'</p>':'')+'<div class="gov-lane-list">'+(Array.isArray(l.items)?l.items:[]).map(x=>'<div class="gov-node"><strong>'+fmt(x.title)+'</strong>'+(x.text?'<p>'+fmt(x.text)+'</p>':'')+'</div>').join('')+'</div></article>').join('')+'</div>'+(b.caption?'<p class="gov-caption">'+fmt(b.caption)+'</p>':'')+'</section>'}
case 'timeline':return '<section class="section-block">'+title+'<div class="timeline">'+list.map(x=>'<article class="timeline-item"><span class="timeline-period">'+fmt(x.period)+'</span><h3>'+fmt(x.title)+'</h3><p>'+fmt(x.text)+'</p></article>').join('')+'</div></section>';
case 'resources':return '<section class="section-block resources">'+title+'<ul>'+list.map(x=>{const u=validHref(x.url);return '<li>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+fmt(x.title)+'</a>':fmt(x.title))+(x.note?'<small>'+fmt(x.note)+'</small>':'')+'</li>'}).join('')+'</ul></section>';
case 'glossary':return '<section class="section-block">'+title+'<dl class="glossary">'+list.map(x=>'<div><dt>'+fmt(x.term)+'</dt><dd>'+fmt(x.definition)+'</dd></div>').join('')+'</dl></section>';
default:return ''}}
function mainHtml(p,i){return '<section class="page" id="page-'+esc(id(p))+'"><h1>'+fmt(p.title)+'</h1>'+(p.intro?'<p class="page-intro">'+fmt(p.intro)+'</p>':'')+(Array.isArray(p.blocks)?p.blocks:[]).map((block,bi)=>editPreview?'<div class="rf-edit-zone" tabindex="0" data-rf-block="'+bi+'">'+renderBlock(block)+'</div>':renderBlock(block)).join('')+'<div class="page-footer">'+(i?'<a class="footlink" href="#'+esc(id(pages[i-1]))+'"><span class="foot-label">Previous</span><span class="footname">← '+fmt(pages[i-1].title)+'</span></a>':'<span></span>')+(i<pages.length-1?'<a class="footlink" href="#'+esc(id(pages[i+1]))+'"><span class="foot-label">Next</span><span class="footname">'+fmt(pages[i+1].title)+' →</span></a>':'')+'</div></section>'}
$('brand').textContent=(data.meta||{}).title||'Reference guide';$('subtitle').textContent=(data.meta||{}).subtitle||'';document.title=((data.meta||{}).title||'Reference guide');
$('main').innerHTML=pages.map(mainHtml).join('');$('nav').innerHTML=pages.map(p=>'<a class="'+(p.parent?'child':'')+'" href="#'+esc(id(p))+'">'+fmt(p.title)+'</a>').join('');
let previewPage=editPreview?initialPageId:null;function select(){const hash=previewPage||decodeURIComponent(location.hash.slice(1));const current=pages.some(p=>id(p)===hash)?hash:id(pages[0]||{});document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+current));document.querySelectorAll('.site-nav a').forEach(a=>{if(a.getAttribute('href')==='#'+current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('search-panel').classList.remove('visible');window.scrollTo(0,0);notifyStudio('page',{pageId:current})}
document.addEventListener('click',e=>{if(editPreview){const block=e.target.closest('[data-rf-block]');if(block){const active=block.closest('.page');if(active){const pageId=active.id.slice(5),blockIndex=Number(block.getAttribute('data-rf-block'));notifyStudio('block',{pageId,blockIndex});document.querySelectorAll('.rf-selected').forEach(el=>el.classList.remove('rf-selected'));block.classList.add('rf-selected')}}}const a=e.target.closest('a[href^="#"]');if(a&&location.protocol==='about:'){e.preventDefault();previewPage=decodeURIComponent(a.getAttribute('href').slice(1));select()}});window.addEventListener('hashchange',select);if(editPreview){window.addEventListener('message',e=>{const m=e.data;if(!m||m.source!=='refract-studio'||m.type!=='select')return;if(m.pageId&&pages.some(p=>id(p)===m.pageId)&&m.pageId!==previewPage){previewPage=m.pageId;select()}document.querySelectorAll('.rf-selected').forEach(el=>el.classList.remove('rf-selected'));if(Number.isInteger(m.blockIndex)){const b=document.querySelector('#page-'+CSS.escape(m.pageId||previewPage)+' [data-rf-block="'+m.blockIndex+'"]');if(b){b.classList.add('rf-selected');b.scrollIntoView({block:'nearest',behavior:'smooth'})}}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-rf-block]')){e.preventDefault();e.target.click()}})}select();$('print').addEventListener('click',()=>window.print());
$('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q){$('search-panel').classList.remove('visible');return}const gs=gloss.filter(g=>String(g.term||'').toLowerCase().includes(q)).slice(0,4);const hits=pages.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).slice(0,Math.max(1,10-gs.length));const glossaryPage=pages.find(p=>p.blocks?.some(b=>b.type==='glossary'))||pages.find(p=>/glossary|acronym|terms/.test(p.id));$('search-panel').innerHTML=(gs.length&&glossaryPage?gs.map(g=>'<a href="#'+esc(id(glossaryPage))+'"><span class="search-type">Term</span>'+esc(g.term)+'</a>').join(''):'')+hits.map(p=>'<a href="#'+esc(id(p))+'"><span class="search-type">Page</span>'+fmt(p.title)+'</a>').join('')||'<p>No matching pages</p>';$('search-panel').classList.add('visible')});
$('search-panel').addEventListener('click',e=>{if(e.target.closest('a')){$('search').value='';$('search-panel').classList.remove('visible')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('search-panel').classList.remove('visible');$('search').blur()}});
})();
</script>
</body></html>
